    --rosso:#D7261D; --rosso-s:#A31510;

  body{font-family:'Fredoka',system-ui,sans-serif;

  .app{width:100%; max-width:440px; min-height:100dvh; display:flex; flex-direction:column;
       padding:14px 16px calc(16px + env(safe-area-inset-bottom)); position:relative;}

  .logo{font-family:'Anton',sans-serif; text-align:left; display:flex; flex-direction:column;}

  .logo .l2{font-size:23px; line-height:.92; color:var(--giallo); -webkit-text-stroke:1px #000; letter-spacing:.5px;}

  .chip.me .val{color:var(--giallo);} .chip.bank .val{color:#bbb;} .chip .coin{color:var(--oro);}

  @keyframes flash{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}

  .meta{display:flex; align-items:center; justify-content:space-between; font-size:13px; opacity:.85; margin-bottom:8px;}
  .meta .role{font-weight:600; color:var(--giallo);}
  .stage{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:6px 0 12px;}
  .prompt{text-align:center; font-size:15px; font-weight:600; min-height:22px; opacity:.95;}
  .prompt b{color:var(--giallo);}

  /* voce del Banco */
  .bankSay{display:flex; align-items:center; gap:10px; background:var(--antracite); border:1px solid #000;
    border-radius:14px; padding:10px 14px; font-size:14px; font-style:italic; opacity:.95;
    box-shadow:0 2px 0 #000; animation:pop .35s ease;}
  .bankSay .face{width:34px;height:34px;flex:none;border-radius:50%;background:linear-gradient(160deg,#4a4a52,#26262a);
    display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid #000;}
  .bankSay .txt b{color:var(--giallo); font-style:normal;}

  .card{position:relative; border-radius:18px; padding:20px; min-height:170px; display:flex; flex-direction:column;
    box-shadow:0 10px 30px rgba(0,0,0,.5), 0 3px 0 rgba(0,0,0,.6); transition:transform .4s;}
  .card .ribbon{position:absolute; top:14px; left:50%; transform:translateX(-50%); background:var(--rosso);
    color:#fff; font-family:'Anton',sans-serif; font-size:11px; letter-spacing:1px; padding:3px 16px;
    border-radius:4px; box-shadow:0 2px 0 var(--rosso-s); white-space:nowrap;}
  .card .ribbon.correct{background:var(--verde); box-shadow:0 2px 0 var(--verde-s);}
  .card .cat{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; text-align:center; margin-top:22px; font-weight:600;}
  .card .text{flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    font-weight:600; font-size:21px; line-height:1.25; padding:10px 4px;}
  .card.q{background:linear-gradient(160deg, var(--giallo-chiaro), var(--giallo)); color:var(--nero);}
  .card.q .cat{color:#8a6d00;} .card.a{background:linear-gradient(160deg, var(--antracite-2), var(--antracite)); color:#fff;}
  .card .detail{font-size:14px; font-weight:400; opacity:.7; margin-top:6px;}

  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .opt{background:var(--antracite); border:2px solid #000; border-radius:14px; padding:14px 10px; color:var(--panna);
    font-family:'Fredoka'; font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 3px 0 #000; transition:transform .08s;}
  .opt:active{transform:translateY(2px); box-shadow:0 1px 0 #000;}
  .opt.correct{background:var(--verde); border-color:var(--verde-s);}
  .opt.wrong{background:var(--rosso); border-color:var(--rosso-s);}

  /* puntata variabile */
  .stake{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:2px;}
  .stake .lbl{font-size:13px; opacity:.75;}
  .stake .amt{display:flex; gap:6px;}
  .stake button{width:44px; height:40px; border-radius:12px; border:2px solid #000; background:var(--antracite);
    color:var(--panna); font-family:'Anton'; font-size:18px; cursor:pointer; box-shadow:0 3px 0 #000;}
  .stake button.on{background:var(--oro); color:var(--nero); border-color:#8a6d00;}
  .bets{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .bet{border:none; border-radius:16px; padding:15px 10px; cursor:pointer; font-family:'Anton',sans-serif;
    font-size:17px; letter-spacing:.5px; color:#fff; display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 4px 0 rgba(0,0,0,.5); transition:transform .08s;}
  .bet:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.5);}
  .bet.giusto{background:var(--verde);} .bet.sbagliato{background:var(--rosso);}
  .bet .ic{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .hint{font-size:12px; text-align:center; opacity:.6; min-height:16px;}

  /* timer */
  .timer{width:100%; margin:2px 0 4px;}
  .timer .track{height:12px; border-radius:8px; background:var(--antracite); overflow:hidden; border:1px solid #000; box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
  .timer .fill{height:100%; width:100%; border-radius:8px; background:linear-gradient(90deg,#3ec85a,#8fe26a);
    transition:width .1s linear;}
  .timer .fill.warn{background:linear-gradient(90deg,#f5b800,#ffd24d);}
  .timer .fill.danger{background:linear-gradient(90deg,#d7261d,#ff6a5f);}
  .timer .lbl{display:flex; justify-content:space-between; font-size:11px; opacity:.7; margin-top:3px;}
  .timer .lbl .sec{font-family:'Anton'; font-size:14px;}
  .timer.pulse .track{animation:tpulse .5s ease infinite;}
  @keyframes tpulse{0%,100%{box-shadow:inset 0 1px 3px rgba(0,0,0,.6), 0 0 0 rgba(215,38,29,0);}50%{box-shadow:inset 0 1px 3px rgba(0,0,0,.6), 0 0 12px rgba(215,38,29,.6);}}

  .result{text-align:center; padding:12px; border-radius:14px; font-weight:600; font-size:15px; animation:pop .4s ease;}
  .result.win{background:rgba(46,170,74,.18); border:1px solid var(--verde);}
  .result.lose{background:rgba(215,38,29,.18); border:1px solid var(--rosso);}
  .result .delta{font-family:'Anton',sans-serif; font-size:26px; display:block; margin-top:2px;}
  .result.win .delta{color:#7ee08f;} .result.lose .delta{color:#ff8a82;}
  @keyframes pop{from{transform:scale(.94);opacity:0;} to{transform:scale(1);opacity:1;}}

  .cta{width:100%; border:none; border-radius:16px; padding:15px; font-family:'Anton',sans-serif; font-size:19px;
    letter-spacing:.5px; color:#fff; cursor:pointer; margin-top:4px;
    background:linear-gradient(180deg,#3ec85a,#22a043); box-shadow:0 5px 0 #17742f; transition:transform .08s;}
  .cta:active{transform:translateY(3px); box-shadow:0 2px 0 #17742f;}
  .footer{font-size:11px; text-align:center; opacity:.4; margin-top:10px;}
  .overlay{position:fixed; inset:0; background:rgba(5,5,7,.94); z-index:20; display:flex; align-items:center; justify-content:center; padding:24px;}
  .panel{max-width:390px; width:100%; text-align:center;}
  .panel .biglogo{font-family:'Anton',sans-serif; line-height:.85; margin-bottom:14px;}
  .panel .biglogo .a{font-size:32px;color:#fff;-webkit-text-stroke:1.5px #000;}
  .panel .biglogo .b{font-size:52px;color:var(--giallo);-webkit-text-stroke:2px #000;}
  .panel .biglogo .c{font-size:40px;color:#fff;-webkit-text-stroke:1.5px #000;}
  .panel p{opacity:.85; font-size:14px; line-height:1.5; margin-bottom:8px;}
  .panel .rules{background:var(--antracite); border-radius:14px; padding:14px 16px; text-align:left; font-size:13px; line-height:1.6; margin:14px 0; border:1px solid #000;}
  .panel .rules b{color:var(--giallo);}
  .tagline{font-style:italic; color:var(--rosso); font-weight:600; margin-bottom:16px;}

  .dossier{display:flex; align-items:center; justify-content:center; gap:14px; font-size:11.5px;

  .dossier .t{opacity:.6; letter-spacing:.3px;}
  .dossier .v{font-weight:600;}
  .dossier .v.g{color:#7ee08f;} .dossier .v.r{color:#ff8a82;}

  /* tutorial */
  .dots{display:flex; gap:7px; justify-content:center; margin:14px 0 10px;}
  .dots span{width:8px;height:8px;border-radius:50%;background:#4a4a52;transition:all .2s;}
  .dots span.on{background:var(--giallo); width:20px; border-radius:5px;}
  .skip{display:block; width:100%; margin-top:10px; background:none; border:none; color:var(--panna);
    opacity:.5; font-family:'Fredoka'; font-size:13px; cursor:pointer; text-decoration:underline;}
  .tstep h2{font-family:'Anton',sans-serif; font-size:24px; color:var(--giallo); margin-bottom:10px; letter-spacing:.5px;}
  .tstep .big-ic{font-size:46px; margin-bottom:8px;}
  .tstep .box{background:var(--antracite); border:1px solid #000; border-radius:14px; padding:14px 16px;
    text-align:left; font-size:13.5px; line-height:1.6; margin-top:12px;}
  .tstep .box b{color:var(--giallo);}
  .tstep .row{display:flex; align-items:center; gap:10px; margin:8px 0;}
  .tstep .row .k{flex:none; width:30px;height:30px;border-radius:50%; display:flex;align-items:center;
    justify-content:center; font-size:15px; font-weight:700;}
  .tstep .k.g{background:var(--verde);} .tstep .k.r{background:var(--rosso);} .tstep .k.o{background:var(--oro); color:#000;}
  .tstep .persona{display:flex; gap:8px; align-items:flex-start; margin:9px 0; font-size:13px; text-align:left;}
  .tstep .persona .f{font-size:22px; flex:none;}
  .final-score{font-family:'Anton',sans-serif; font-size:20px; margin:8px 0;}
  .final-score .big{font-size:50px; display:block; color:var(--giallo);}
  .hidden{display:none !important;}
</style>
</head>

</div>

/* ---- personalità del Banco ---- */
/* frasi comuni a tutti i caratteri: non devono rivelare la personalità */
const SAYS_ANSWER=["Vediamo un po'…","Ci penso su.","Ah, questa…","Dammi un secondo.",
  "Mmh, interessante.","Ok, ci provo.","Questa la conosco… forse.","Aspetta che ragiono."];
const SAYS_BET=["Ho la mia idea.","Vediamo come va.","Punto e vediamo.","Ci scommetto qualcosa.",
  "Ho deciso.","La mia puntata è fatta.","Sento qualcosa.","Scelta fatta."];

const PERSONAS = {
  prudente:{
    nome:"prudente", face:"🎩", reveal:"Il Banco era PRUDENTE: rispondeva bene, ma puntava su di te con cautela.",
    // quanto spesso il Banco risponde bene rispetto alla difficoltà (competenza)
    skill:0.22,       // bonus: sbaglia meno
    fumble:0.05,      // papera casuale anche sulle facili
    // da Puntatore contro di te: tende a puntare GIUSTO (crede negli altri)
    betWrongBias:-0.15,
    saysAnswering:SAYS_ANSWER, saysBetting:SAYS_BET
  },
  spavaldo:{
    nome:"spavaldo", face:"🎩", reveal:"Il Banco era SPAVALDO: sicuro di sé, ma la sicurezza lo tradiva spesso.",
    skill:-0.10,      // sbaglia di più di quanto sembri
    fumble:0.15,      // papera spesso anche le facili
    betWrongBias:0.20, // da Puntatore scommette volentieri che sbagli
    saysAnswering:SAYS_ANSWER, saysBetting:SAYS_BET
  },
  lunatico:{
    nome:"lunatico", face:"🎩", reveal:"Il Banco era LUNATICO: imprevedibile, un turno geniale e uno disastroso.",
    skill:0.0, fumble:0.18, betWrongBias:0.0, chaos:0.28,  // aggiunge rumore forte
    saysAnswering:SAYS_ANSWER, saysBetting:SAYS_BET
  }
};
const CONFIDENT=["L'ho già sentita questa.","Tranquilli, ci sono.","Questa è nelle mie corde."];
const UNSURE=["Uhm, non vorrei sbagliare…","Questa mi frega, forse.","Categoria ostica per me."];

const TOT=10, START=15, TIME=15;
let deck=[], turn=0, me=START, bank=START, current=null, role=null, persona=null, stake=2;
let timerId=null, timeLeft=0;
let bankHits=0, bankMiss=0, bankBetsW=0, bankBetsG=0;   // storico per indizi sul carattere
const seen = new Set();   // domande già uscite: evita ripetizioni tra partite
const $=id=>document.getElementById(id);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

/* ---- motore timer ---- */
function startTimer(onExpire){
  stopTimer();
  timeLeft=TIME;
  $('timerBox').innerHTML=
    `<div class="timer" id="timer"><div class="track"><div class="fill" id="tfill"></div></div>`+
    `<div class="lbl"><span>Tempo</span><span class="sec" id="tsec">${TIME}</span></div></div>`;
  const fill=$('tfill'), sec=$('tsec'), box=$('timer');
  const t0=Date.now();
  timerId=setInterval(()=>{
    const el=(Date.now()-t0)/1000; timeLeft=Math.max(0, TIME-el);
    const pct=timeLeft/TIME*100;
    fill.style.width=pct+'%';
    sec.textContent=Math.ceil(timeLeft);
    fill.classList.toggle('warn', timeLeft<=5 && timeLeft>3);
    fill.classList.toggle('danger', timeLeft<=3);
    box.classList.toggle('pulse', timeLeft<=3);
    if(timeLeft<=0){ stopTimer(); onExpire(); }
  }, 100);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } $('timerBox').innerHTML=''; }

function startGame(){
  // pesca 10 domande evitando quelle già viste nelle partite precedenti
  let pool = QUESTIONS.filter(x=>!seen.has(x.q));
  if(pool.length < TOT){ seen.clear(); pool = QUESTIONS.slice(); }  // esaurite: si riparte
  deck = shuffle(pool).slice(0,TOT);
  deck.forEach(x=>seen.add(x.q));
  turn=0; me=START; bank=START;
  bankHits=0; bankMiss=0; bankBetsW=0; bankBetsG=0;
  persona=PERSONAS[pick(Object.keys(PERSONAS))];   // carattere nascosto
  $('startOverlay').classList.add('hidden'); $('endOverlay').classList.add('hidden');
  $('turnTot').textContent=TOT; updateScores(true); nextTurn();
}
function updateScores(noflash){
  $('meScore').textContent=me; $('bankScore').textContent=bank;
  if(!noflash){ $('meScore').classList.remove('flash'); void $('meScore').offsetWidth; $('meScore').classList.add('flash'); }
}

/* il Banco risponde bene? combina difficoltà, skill, papere e caos del carattere */
function bankAnswersCorrectly(){
  let pCorrect = (1 - current.diff) + persona.skill;
  if(persona.chaos){ pCorrect += (Math.random()*2-1)*persona.chaos; }   // lunatico: forte rumore
  pCorrect = clamp(pCorrect, 0.05, 0.95);
  let correct = Math.random() < pCorrect;
  // papera: anche una facile può cadere
  if(correct && Math.random() < persona.fumble) correct=false;
  return correct;
}
/* da Puntatore, il Banco scommette SBAGLIATO su di te con questa probabilità */
function bankBetsWrongOnYou(){
  let p = current.diff + persona.betWrongBias;
  if(persona.chaos){ p += (Math.random()*2-1)*persona.chaos; }
  return Math.random() < clamp(p,0.1,0.9);
}
function bankSay(list, sub){
  $('bankSayBox').innerHTML =
    `<div class="bankSay"><div class="face">${persona.face}</div>`+
    `<div class="txt">Banco: <b>«${pick(list)}»</b>${sub?`<br><span style="opacity:.6;font-size:12px">${sub}</span>`:''}</div></div>`;
}

function renderDossier(){
  const tot=bankHits+bankMiss;
  if(tot===0 && bankBetsW+bankBetsG===0){
    $('dossier').innerHTML=`<div class="dossier"><span class="t">🕵️ Identikit del Banco: ancora nessun indizio…</span></div>`;
    return;
  }
  let parts=`<span class="t">🕵️ Banco finora:</span>`;
  if(tot>0) parts+=`<span><span class="t">risposte</span> <span class="v g">${bankHits}✓</span> <span class="v r">${bankMiss}✗</span></span>`;
  if(bankBetsW+bankBetsG>0) parts+=`<span><span class="t">punta contro di te</span> <span class="v">${bankBetsW}/${bankBetsW+bankBetsG}</span></span>`;
  $('dossier').innerHTML=`<div class="dossier">${parts}</div>`;
}

function nextTurn(){
  stopTimer();
  if(turn>=TOT) return endGame();
  current=deck[turn];
  role=(turn%2===0)?'RISPONDENTE':'PUNTATORE';
  stake=2;
  $('turnNo').textContent=turn+1;
  $('roleLabel').textContent=role==='RISPONDENTE'?'🎤 Rispondi tu':'🎯 Scommetti tu';
  const card=$('card'), rib=$('cardRibbon');
  card.className='card q'; rib.className='ribbon'; rib.style.background=''; rib.textContent='CHI SBAGLIA PAGA';
  $('cardCat').textContent=current.cat; $('cardText').textContent=current.q; $('hint').textContent='';
  renderDossier();
  if(role==='RISPONDENTE') renderAnswer(); else renderBet();
}

/* --- Tu Rispondente --- */
function renderAnswer(){
  const bankWrong = bankBetsWrongOnYou(); // puntata coperta del Banco
  // il Banco "commenta" la sua fiducia (a volte fuorviante)
  bankSay(SAYS_BET);
  $('prompt').innerHTML=`Il <b>Banco</b> ha puntato su di te… coperto. Rispondi!`;
  const opts=shuffle([current.a, ...current.wrong]);
  const box=document.createElement('div'); box.className='options';
  opts.forEach(o=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=o;
    b.onclick=()=>resolveAnswer(o===current.a,b,box,bankWrong); box.appendChild(b); });
  $('controls').innerHTML=''; $('controls').appendChild(box);
  $('hint').textContent='Tocca la risposta che credi giusta.';
  startTimer(()=>{
    [...box.children].forEach(b=>{ b.disabled=true; if(b.textContent===current.a) b.classList.add('correct'); });
    timeoutAnswer(bankWrong);
  });
}
function resolveAnswer(correct,btn,box,bankWrong){
  stopTimer();
  if(bankWrong) bankBetsW++; else bankBetsG++;
  [...box.children].forEach(b=>b.disabled=true);
  btn.classList.add(correct?'correct':'wrong');
  revealSolution(correct);
  let dMe=0,dBank=0,msg='';
  if(correct){
    if(bankWrong){ dMe=+1; dBank=-2; msg='Risposta giusta: hai ingannato il Banco!'; }
    else { dBank=+2; msg='Giusto, ma il Banco ci aveva scommesso.'; }
  } else { dMe=-2; if(bankWrong){ dBank=+2; msg='Sbagliato — e il Banco l\'aveva previsto.'; }
    else { dBank=0; msg='Sbagliato. Il Banco però puntava sul sì.'; } }
  $('bankSayBox').innerHTML='';
  applyDelta(dMe,dBank, dMe>0, msg, `Il Banco aveva puntato: ${bankWrong?'SBAGLIATO ✗':'GIUSTO ✓'}`);
}
function timeoutAnswer(bankWrong){
  if(bankWrong) bankBetsW++; else bankBetsG++;
  revealSolution(false);
  const dMe=-2, dBank= bankWrong? +2 : 0;
  $('bankSayBox').innerHTML='';
  applyDelta(dMe,dBank,false,'⏱ Tempo scaduto — vale come errore!',
    `Il Banco aveva puntato: ${bankWrong?'SBAGLIATO ✗':'GIUSTO ✓'}`);
}

/* --- Tu Puntatore, con puntata variabile --- */
function renderBet(){
  const bankCorrect = bankAnswersCorrectly();
  // battuta ambigua: a volte coerente col vero, a volte no (bluff)
  const honest = Math.random()<0.6;
  const conf = honest ? bankCorrect : !bankCorrect;
  bankSay(persona.saysAnswering, conf?pick(CONFIDENT):pick(UNSURE));
  $('prompt').innerHTML=`Il <b>Banco</b> deve rispondere. Indovinerà o no?`;

  const wrap=document.createElement('div');
  // selettore puntata
  const st=document.createElement('div'); st.className='stake';
  st.innerHTML='<span class="lbl">Punta:</span>';
  const amt=document.createElement('div'); amt.className='amt';
  [1,2,3].forEach(v=>{ const bt=document.createElement('button'); bt.textContent=v; if(v===stake)bt.classList.add('on');
    bt.onclick=()=>{ stake=v; [...amt.children].forEach(c=>c.classList.toggle('on', +c.textContent===v)); };
    amt.appendChild(bt); });
  st.appendChild(amt); wrap.appendChild(st);
  // bottoni scommessa
  const box=document.createElement('div'); box.className='bets';
  const g=document.createElement('button'); g.className='bet giusto'; g.innerHTML='<span class="ic">✓</span> GIUSTO';
  const s=document.createElement('button'); s.className='bet sbagliato'; s.innerHTML='<span class="ic">✗</span> SBAGLIATO';
  g.onclick=()=>resolveBet(true,bankCorrect); s.onclick=()=>resolveBet(false,bankCorrect);
  box.append(g,s); wrap.appendChild(box);
  $('controls').innerHTML=''; $('controls').appendChild(wrap);
  $('hint').textContent='Categoria: '+current.cat+' — scegli la posta e scommetti.';
  startTimer(()=>{  // tempo scaduto = puntata persa
    [...box.children].forEach(b=>b.disabled=true);
    if(bankCorrect) bankHits++; else bankMiss++;
    revealBankAnswer(bankCorrect);
    let dBank = bankCorrect? 0 : -2;
    $('bankSayBox').innerHTML='';
    applyDelta(-stake, dBank, false, `⏱ Tempo scaduto — puntata persa (posta ${stake})`,
      bankCorrect?'Il Banco aveva risposto bene.':'Il Banco aveva sbagliato.');
  });
}
function resolveBet(betGiusto,bankCorrect){
  stopTimer();
  if(bankCorrect) bankHits++; else bankMiss++;
  revealBankAnswer(bankCorrect);
  const win=(betGiusto===bankCorrect);
  let dMe = win? +stake : -stake;
  let dBank = 0;
  if(!bankCorrect) dBank=-2; else if(!betGiusto) dBank=+1;
  $('bankSayBox').innerHTML='';
  applyDelta(dMe,dBank,win, win?`Puntata azzeccata! (posta ${stake})`:`Puntata sbagliata (posta ${stake})`,
    bankCorrect?'Il Banco ha risposto bene.':'Il Banco ha sbagliato.');
}

function revealSolution(playerCorrect){
  const card=$('card'), rib=$('cardRibbon'); card.className='card a'; $('cardCat').textContent=current.cat;
  if(playerCorrect){ rib.className='ribbon correct'; rib.style.background=''; rib.textContent='HAI RISPOSTO GIUSTO ✓'; }
  else { rib.className='ribbon'; rib.style.background='var(--rosso)'; rib.textContent='HAI SBAGLIATO ✗'; }
  $('cardText').innerHTML=col([['La risposta giusta era',.6,13,400,null],[current.a,1,24,600,'var(--giallo)']],current.detail);
}
function revealBankAnswer(bankCorrect){
  const card=$('card'), rib=$('cardRibbon'); card.className='card a'; $('cardCat').textContent=current.cat;
  const said = bankCorrect? current.a : pick(current.wrong);
  if(bankCorrect){ rib.className='ribbon correct'; rib.style.background=''; rib.textContent='IL BANCO HA INDOVINATO ✓';
    $('cardText').innerHTML=col([['Il Banco ha risposto',.6,13,400,null],[said,1,24,600,'var(--verde)']],current.detail);
  } else { rib.className='ribbon'; rib.style.background='var(--rosso)'; rib.textContent='IL BANCO HA SBAGLIATO ✗';
    $('cardText').innerHTML=
      `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:100%">`+
      `<span style="opacity:.55;font-size:12px">Il Banco ha risposto</span>`+
      `<span style="color:#ff8a82;text-decoration:line-through;font-size:20px">${said}</span>`+
      `<span style="opacity:.55;font-size:12px;margin-top:8px">La risposta giusta era</span>`+
      `<span style="color:var(--giallo);font-size:24px">${current.a}</span>`+
      (current.detail?`<span class="detail">${current.detail}</span>`:'')+`</div>`;
  }
}
function col(rows,detail){
  let h='<div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:100%">';
  rows.forEach(([t,op,fs,fw,c])=>{ h+=`<span style="opacity:${op};font-size:${fs}px;font-weight:${fw};${c?`color:${c}`:''}">${t}</span>`; });
  if(detail) h+=`<span class="detail">${detail}</span>`; return h+'</div>';
}

function applyDelta(dMe,dBank,win,title,sub){
  me+=dMe; bank+=dBank; updateScores();
  const res=document.createElement('div'); res.className='result '+(win?'win':'lose');
  const sign=dMe>0?'+':'';
  res.innerHTML=`${title}<span class="delta">${sign}${dMe} ${Math.abs(dMe)===1?'moneta':'monete'}</span>
    <div style="font-size:12px;opacity:.75;font-weight:400;margin-top:2px">${sub}</div>`;
  $('controls').innerHTML=''; $('controls').appendChild(res);
  const btn=document.createElement('button'); btn.className='cta'; btn.style.marginTop='12px';
  btn.textContent=(turn+1>=TOT)?'VEDI RISULTATO':'TURNO SUCCESSIVO';
  btn.onclick=()=>{ turn++; nextTurn(); };
  $('controls').appendChild(btn);
}

function endGame(){
  $('endMe').textContent=me; $('endBank').textContent=bank;
  const t=$('endTitle'); let msg='';
  if(me>bank){ t.innerHTML='<span class="b">HAI VINTO!</span>'; msg='Hai letto il Banco meglio di quanto lui abbia letto te.'; }
  else if(me<bank){ t.innerHTML='<span class="c">HA VINTO IL BANCO</span>'; msg='Il Banco ti ha battuto. Rivincita?'; }
  else { t.innerHTML='<span class="c">PARI!</span>'; msg='Perfetto equilibrio.'; }
  $('endMsg').textContent=msg;
  $('endReveal').textContent=persona.reveal;
  $('endOverlay').classList.remove('hidden');
}

let step=0;
function renderStep(){
  $('tutoStep').innerHTML=`<div class="tstep">${STEPS[step].html}</div>`;
  $('dots').innerHTML=STEPS.map((_,i)=>`<span class="${i===step?'on':''}"></span>`).join('');

}
$('startBtn').onclick=()=>{ if(step<STEPS.length-1){ step++; renderStep(); } else startGame(); };
$('skipBtn').onclick=()=>startGame();
$('againBtn').onclick=startGame;
